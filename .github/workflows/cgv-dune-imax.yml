name: CGV 센텀 듄3 IMAX 예매 알림

on:
  schedule:
    - cron: "0,30 * * * *"   # 매시 정각·30분 (UTC 기준 = 한국시간도 정각·30분). GitHub 부하로 몇 분 늦게 시작될 수 있음
  workflow_dispatch:
    inputs:
      debug:
        description: "테스트 모드 (결과와 상관없이 카톡 발송)"
        type: boolean
        default: true
      target_date:
        description: "(테스트용) 확인할 날짜 YYYY-MM-DD"
        default: "2027-01-01"
      movie:
        description: "(테스트용) 영화 키워드"
        default: "듄"
      format:
        description: "(테스트용) 상영관 키워드"
        default: "IMAX"
      notify:
        description: "카톡 발송 여부"
        type: boolean
        default: true

permissions:
  actions: write   # 오픈 감지 후 워크플로 자동 비활성화용
  contents: read

concurrency:
  group: cgv-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright==1.47.0 requests
          python -m playwright install --with-deps chromium
      - name: Check CGV
        id: check
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TARGET_DATE: ${{ inputs.target_date || '2027-01-01' }}
          MOVIE_KEYWORDS: ${{ inputs.movie || '듄' }}
          FORMAT_KEYWORD: ${{ inputs.format || 'IMAX' }}
          NOTIFY: ${{ inputs.notify == false && 'false' || 'true' }}
          DEBUG: ${{ inputs.debug || 'false' }}
        run: python check_cgv.py
      - name: 알림 보낸 뒤 자동 중지 (중복 알림 방지)
        if: steps.check.outputs.found == 'true' && inputs.debug != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
