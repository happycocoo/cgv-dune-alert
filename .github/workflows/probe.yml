name: probe (임시 진단)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: probe
        run: |
          cat > p.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          urls = [
            "https://m.place.naver.com/place/13082085/movie?datefilter=2026-11-27",
            "https://pcmap.place.naver.com/place/13082085/movie?datefilter=2026-11-27",
            "https://m.place.naver.com/place/13082085/movie?datefilter=2026-12-18",
          ]
          def sq(s): return re.sub(r"\s+", " ", s)
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(locale="ko-KR", viewport={"width":420,"height":2400}, user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1")
              pg = ctx.new_page()
              apis = []
              pg.on("response", lambda r: apis.append(r.url) if ("graphql" in r.url or "api" in r.url) else None)
              for u in urls:
                  try:
                      r = pg.goto(u, wait_until="networkidle", timeout=45000); pg.wait_for_timeout(2000)
                      t = sq(pg.inner_text("body"))
                      print("=====", u, r.status if r else None, len(t)); print(t[:2500])
                  except Exception as e: print("=====", u, "ERR", e)
              print("APIS:", sorted(set(a.split("?")[0] for a in apis))[:30])
              b.close()
          PY
          python p.py
